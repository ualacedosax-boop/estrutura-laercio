<title>Estrutura Residência Laércio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: o modelo ocupa a tela inteira; cabeçalho e controles flutuam como uma prancha técnica */
:root{
  --bg:#e9ecea; --panel:rgba(255,255,255,.88); --fg:#1d2422; --muted:#5d6966; --line:#c9d0cd;
  --accent:#1f8a4c; --accent-fg:#fff;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a19;--panel:rgba(28,34,33,.9);--fg:#e8eeec;--muted:#9aa7a3;--line:#34403d;--accent:#3cb371;--accent-fg:#0d1311;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a19;--panel:rgba(28,34,33,.9);--fg:#e8eeec;--muted:#9aa7a3;--line:#34403d;--accent:#3cb371;--accent-fg:#0d1311;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{pointer-events:auto;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,3.2vw,26px);margin:2px 0 4px;text-wrap:balance}
.sub{font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:20px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bottom{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp h2{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 13px var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.controls{display:flex;flex-direction:column;gap:10px}
.hint{font-size:11.5px;color:var(--muted)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.plab{position:absolute;left:0;top:0;font:500 11px var(--f-mono);color:#fff;background:#c0563f;padding:1px 5px;border-radius:4px;white-space:nowrap;will-change:transform}
.vlab{background:#3f7fb0;font-size:10px;opacity:.92}
@media (max-width:640px){.stats{display:none}.bottom .card{width:100%}}
</style>
<canvas id="cv" aria-label="Modelo 3D da estrutura"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="ui">
  <header>
    <div class="card">
      <div class="eyebrow">UL Engenharia · Projeto estrutural</div>
      <h1>Estrutura · Residência Laércio</h1>
      <div class="sub">Concreto armado · arraste para girar, role ou pinça para aproximar</div>
    </div>
    <div class="card stats" id="stats"></div>
  </header>
  <div class="bottom">
    <div class="card controls">
      <div class="grp"><h2>Pavimentos</h2><div class="chips" id="storeys"></div></div>
      <div class="grp"><h2>Elementos</h2><div class="chips" id="types"></div></div>
    </div>
    <div class="card controls">
      <div class="grp"><h2>Vista</h2><div class="chips">
        <button id="v3d" type="button">3D</button><button id="vfr" type="button">Frente</button>
        <button id="vla" type="button">Lateral</button><button id="vto" type="button">Topo</button>
        <button id="spin" type="button" aria-pressed="false">Girar</button>
        <button id="names" type="button" aria-pressed="true">Nomes P1…</button>
        <button id="vnames" type="button" aria-pressed="true">Nomes V1…</button>
      </div></div>
      <div class="hint">Eng. Ualace Leite · Feira de Santana-BA</div>
    </div>
  </div>
</div>

  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(bin,g.io,g.inn),1));
  const flat=geo.toNonIndexed();flat.computeVertexNormals();
  const col=(TYPES[g.type]||['', '#999'])[1];
  const slab=g.type==='IfcSlab';
  const m=new THREE.Mesh(flat,new THREE.MeshStandardMaterial({color:col,roughness:.85,metalness:0,transparent:slab,opacity:slab?.82:1,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));

const size=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());

const types=Object.keys(TYPES).filter(t=>DATA.meta.groups.some(g=>g.type===t));
const stos=[...new Set(DATA.meta.groups.map(g=>g.storey))];

const cnt=t=>DATA.meta.distinct[t];
const labBox=document.getElementById('labels');
const mk=(n,cls,x,y,z,kind,sto)=>{const d=document.createElement('div');d.className=cls;d.textContent=n;labBox.appendChild(d);return{d,kind,sto,p:new THREE.Vector3(x,y,z)}};
const labs=[...DATA.meta.labels.map(([n,x,y,z])=>mk(n,'plab',x,y+.25,z,'IfcColumn',null)),
  ...DATA.meta.beams.map(([n,s,x,y,z])=>mk(n,'plab vlab',x,y+.12,z,'IfcBeam',s))];
const show={IfcColumn:true,IfcBeam:true};
[['names','IfcColumn'],['vnames','IfcBeam']].forEach(([id,k])=>{const b=document.getElementById(id);b.onclick=()=>{show[k]=!show[k];b.setAttribute('aria-pressed',show[k])}});
const tmp=new THREE.Vector3();
function drawLabels(){const w=innerWidth,h=innerHeight;
  for(const l of labs){const vis=show[l.kind]&&on.type[l.kind]&&(!l.sto||on.storey[l.sto]);
    tmp.copy(l.p).project(cam);const ok=vis&&tmp.z<1;l.d.hidden=!ok;if(ok)l.d.style.transform=`translate(${(tmp.x+1)/2*w}px,${(1-tmp.y)/2*h}px) translate(-50%,-100%)`}}
